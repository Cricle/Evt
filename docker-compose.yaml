name: evt

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u${MYSQL_USER} -p${MYSQL_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 15s
    volumes:
      - ./custom/data/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
      args:
        NODE_VERSION: ${NODE_VERSION}
        RUST_VERSION: ${RUST_VERSION}
        ALPINE_VERSION: ${ALPINE_VERSION}
        NPM_REGISTRY: ${NPM_REGISTRY}
        ALPINE_MIRROR: ${ALPINE_MIRROR}
        CARGO_REGISTRY_INDEX: ${CARGO_REGISTRY_INDEX}
        VITE_HOST: ${VITE_HOST}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
        ALL_PROXY: ${ALL_PROXY}
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      EVT_RS__DATABASE__URL: ${EVT_DATABASE_URL}
      EVT_RS__JWT__SECRET: ${EVT_JWT_SECRET}
      EVT_RS__STORAGE__LOCAL_DIR: ${EVT_STORAGE_LOCAL_DIR}
    volumes:
      - ./custom:/app/custom
    ports:
      - "${EVT_HTTP_PORT}:8008"
      - "${EVT_GRPC_PORT}:18020"
