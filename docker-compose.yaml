services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - ./custom/data/mysql:/var/lib/mysql
    ports:
      - "${MYSQL_PORT}:3306"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION}
        RUST_VERSION: ${RUST_VERSION}
        ALPINE_VERSION: ${ALPINE_VERSION}
        VITE_HOST: ${VITE_HOST}
    restart: always
    depends_on:
      - db
    environment:
      PAOPAO_RS__DATABASE__URL: ${PAOPAO_DATABASE_URL}
      PAOPAO_RS__JWT__SECRET: ${PAOPAO_JWT_SECRET}
      PAOPAO_RS__STORAGE__LOCAL_DIR: ${PAOPAO_STORAGE_LOCAL_DIR}
    volumes:
      - ./custom:/app/custom
    ports:
      - "${PAOPAO_HTTP_PORT}:8008"
      - "${PAOPAO_GRPC_PORT}:18020"
